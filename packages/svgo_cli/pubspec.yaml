name: svgo_cli
description: Command-line interface for SVGO - a tool for optimizing SVG files. Port of the popular Node.js SVGO optimizer.
version: 1.2.0
repository: https://github.com/fluttercandies/svgo
issue_tracker: https://github.com/fluttercandies/svgo/issues
homepage: https://github.com/fluttercandies/svgo

environment:
  sdk: ^3.0.0

executables:
  svgo: svgo_cli

dependencies:
  args: ^2.7.0
  svgo: ^1.2.0
  path: ^1.9.1
  glob: ^2.1.3
  yaml: ^3.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - svg
  - cli
  - optimization
  - command-line
  - tools
