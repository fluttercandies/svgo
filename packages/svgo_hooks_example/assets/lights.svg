            <rect x="-6" y="-1" width="12" height="10" rx="3" fill="#5F4C6C" />
        </g>
    </defs>

    <path d="M -140 -60 Q -70 -50 0 -60 Q 110 -70 110 10" />
    <line x1="-70" y1="-15" x2="-70" y2="-55" />
    <line x1="30" y1="-25" x2="30" y2="-60" />
    <use
        class="b"
        href="#bulb"
        x="-120"
        y="-45"
        transform="rotate(5)"
        fill="white"
    />
    <use
        class="b"
        href="#bulb"
        x="-70"
        y="-15"
        fill="white"
    />
    <use
        class="b"
        href="#bulb"
        x="-20"
        y="-57"
        transform="rotate(-5)"
        fill="white"
    />
    <use
        class="b"
